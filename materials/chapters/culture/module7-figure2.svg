<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="380" viewBox="0 0 1100 380" role="img"><title>Two separate cultural questions</title><desc>Self-orientation and norm strength should be measured separately within specified domains.</desc><rect width="1100" height="380" rx="22" fill="#f3f7fa"/><text x="40" y="58" font-family="Arial,sans-serif" font-size="29" font-weight="bold" fill="#19384a">Two separate cultural questions</text><rect x="40.0" y="110" width="325.3333333333333" height="165" rx="14" fill="#e0ebf3"/><text x="58.0" y="166" font-family="Arial,sans-serif" font-size="23" fill="#19384a">How is the self related</text><text x="58.0" y="196" font-family="Arial,sans-serif" font-size="23" fill="#19384a">to others?</text><rect x="387.3333333333333" y="110" width="325.3333333333333" height="165" rx="14" fill="#e0ebf3"/><text x="405.3333333333333" y="166" font-family="Arial,sans-serif" font-size="23" fill="#19384a">How strongly are norms</text><text x="405.3333333333333" y="196" font-family="Arial,sans-serif" font-size="23" fill="#19384a">enforced?</text><rect x="734.6666666666666" y="110" width="325.3333333333333" height="165" rx="14" fill="#e0ebf3"/><text x="752.6666666666666" y="166" font-family="Arial,sans-serif" font-size="23" fill="#19384a">Which domain and setting?</text><text x="40" y="315" font-family="Arial,sans-serif" font-size="19" fill="#19384a">Self-orientation and norm strength should be measured separately within specified domains.</text></svg>