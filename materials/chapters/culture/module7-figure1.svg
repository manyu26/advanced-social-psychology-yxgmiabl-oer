<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="380" viewBox="0 0 1100 380" role="img"><title>Culture operates across levels</title><desc>Meanings circulate across people and settings; a population average does not determine an individual.</desc><rect width="1100" height="380" rx="22" fill="#f3f7fa"/><text x="40" y="58" font-family="Arial,sans-serif" font-size="29" font-weight="bold" fill="#19384a">Culture operates across levels</text><rect x="40.0" y="110" width="325.3333333333333" height="165" rx="14" fill="#e0ebf3"/><text x="58.0" y="166" font-family="Arial,sans-serif" font-size="23" fill="#19384a">Individual interpretation</text><rect x="387.3333333333333" y="110" width="325.3333333333333" height="165" rx="14" fill="#e0ebf3"/><text x="405.3333333333333" y="166" font-family="Arial,sans-serif" font-size="23" fill="#19384a">Interaction and networks</text><rect x="734.6666666666666" y="110" width="325.3333333333333" height="165" rx="14" fill="#e0ebf3"/><text x="752.6666666666666" y="166" font-family="Arial,sans-serif" font-size="23" fill="#19384a">Institutions and history</text><text x="40" y="315" font-family="Arial,sans-serif" font-size="19" fill="#19384a">Meanings circulate across people and settings; a population average does not determine an individual.</text></svg>