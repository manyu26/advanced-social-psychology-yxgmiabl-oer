<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="380" viewBox="0 0 1100 380" role="img"><title>A social influence pathway</title><desc>The effect of a message can involve information, social rewards, or practical barriers.</desc><rect width="1100" height="380" rx="22" fill="#f3f7fa"/><text x="40" y="58" font-family="Arial,sans-serif" font-size="29" font-weight="bold" fill="#19384a">A social influence pathway</text><rect x="40.0" y="110" width="238.5" height="165" rx="14" fill="#e0ebf3"/><text x="58.0" y="166" font-family="Arial,sans-serif" font-size="23" fill="#19384a">Message or social</text><text x="58.0" y="196" font-family="Arial,sans-serif" font-size="23" fill="#19384a">cue</text><rect x="300.5" y="110" width="238.5" height="165" rx="14" fill="#e0ebf3"/><text x="318.5" y="166" font-family="Arial,sans-serif" font-size="23" fill="#19384a">Perceived</text><text x="318.5" y="196" font-family="Arial,sans-serif" font-size="23" fill="#19384a">information and</text><text x="318.5" y="226" font-family="Arial,sans-serif" font-size="23" fill="#19384a">value</text><rect x="561.0" y="110" width="238.5" height="165" rx="14" fill="#e0ebf3"/><text x="579.0" y="166" font-family="Arial,sans-serif" font-size="23" fill="#19384a">Feasible action</text><rect x="821.5" y="110" width="238.5" height="165" rx="14" fill="#e0ebf3"/><text x="839.5" y="166" font-family="Arial,sans-serif" font-size="23" fill="#19384a">Observed outcome</text><text x="40" y="315" font-family="Arial,sans-serif" font-size="19" fill="#19384a">The effect of a message can involve information, social rewards, or practical barriers.</text></svg>