<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="380" viewBox="0 0 1100 380" role="img"><title>Four questions about emotion</title><desc>Evidence addressing one explanatory question does not automatically resolve the others.</desc><rect width="1100" height="380" rx="22" fill="#f3f7fa"/><text x="40" y="58" font-family="Arial,sans-serif" font-size="29" font-weight="bold" fill="#19384a">Four questions about emotion</text><rect x="40.0" y="110" width="238.5" height="165" rx="14" fill="#e0ebf3"/><text x="58.0" y="166" font-family="Arial,sans-serif" font-size="23" fill="#19384a">Mechanism</text><rect x="300.5" y="110" width="238.5" height="165" rx="14" fill="#e0ebf3"/><text x="318.5" y="166" font-family="Arial,sans-serif" font-size="23" fill="#19384a">Development</text><rect x="561.0" y="110" width="238.5" height="165" rx="14" fill="#e0ebf3"/><text x="579.0" y="166" font-family="Arial,sans-serif" font-size="23" fill="#19384a">Evolutionary</text><text x="579.0" y="196" font-family="Arial,sans-serif" font-size="23" fill="#19384a">history</text><rect x="821.5" y="110" width="238.5" height="165" rx="14" fill="#e0ebf3"/><text x="839.5" y="166" font-family="Arial,sans-serif" font-size="23" fill="#19384a">Function</text><text x="40" y="315" font-family="Arial,sans-serif" font-size="19" fill="#19384a">Evidence addressing one explanatory question does not automatically resolve the others.</text></svg>