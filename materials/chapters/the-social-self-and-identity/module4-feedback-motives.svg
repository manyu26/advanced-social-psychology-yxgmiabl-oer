<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="460" viewBox="0 0 1100 460" role="img" aria-labelledby="title desc"><title id="title">Three goals for feedback</title><desc id="desc">Favorability, consistency, and actionable change can lead to different feedback preferences.</desc><rect width="1100" height="460" rx="24" fill="#f5f8fb"/><style>text{font-family:Arial,sans-serif;fill:#17334a}.head{font-size:28px;font-weight:700}.label{font-size:23px;font-weight:700}.small{font-size:20px}</style><text x="40" y="54" class="head">What should feedback accomplish?</text><rect x="35" y="115" width="310" height="205" rx="14" fill="#e3edf6"/><text x="53" y="153" class="label">Self-enhancement</text><text x="53" y="191" class="small">A more favorable view</text><text x="53" y="220" class="small">of oneself</text><text x="53" y="249" class="small">What feels affirming?</text><rect x="395" y="115" width="310" height="205" rx="14" fill="#e3edf6"/><text x="413" y="153" class="label">Self-verification</text><text x="413" y="191" class="small">Confirmation of an</text><text x="413" y="220" class="small">existing self-belief</text><text x="413" y="249" class="small">What feels consistent?</text><rect x="755" y="115" width="310" height="205" rx="14" fill="#e3edf6"/><text x="773" y="153" class="label">Self-improvement</text><text x="773" y="191" class="small">Information that helps</text><text x="773" y="220" class="small">change performance</text><text x="773" y="249" class="small">What can I act on?</text><text x="80" y="395" class="small">One message can satisfy several goals. Observe choice and later use.</text></svg>