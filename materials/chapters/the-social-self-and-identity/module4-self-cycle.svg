<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="460" viewBox="0 0 1100 460" role="img" aria-labelledby="title desc"><title id="title">A cycle of self-representation and action</title><desc id="desc">Four stages connect representation, evidence, evaluation, and action; action changes later contexts.</desc><rect width="1100" height="460" rx="24" fill="#f5f8fb"/><style>text{font-family:Arial,sans-serif;fill:#17334a}.head{font-size:28px;font-weight:700}.label{font-size:23px;font-weight:700}.small{font-size:20px}</style><text x="40" y="54" class="head">From self-representation to the next action</text><rect x="35" y="115" width="235" height="165" rx="14" fill="#e3edf6"/><text x="53" y="153" class="label">Representation</text><text x="53" y="191" class="small">What is active</text><text x="53" y="220" class="small">in this context?</text><text x="277" y="210" class="head">→</text><rect x="303" y="115" width="235" height="165" rx="14" fill="#e3edf6"/><text x="321" y="153" class="label">Evidence</text><text x="321" y="191" class="small">What gets selected</text><text x="321" y="220" class="small">and interpreted?</text><text x="545" y="210" class="head">→</text><rect x="571" y="115" width="235" height="165" rx="14" fill="#e3edf6"/><text x="589" y="153" class="label">Evaluation</text><text x="589" y="191" class="small">What does this</text><text x="589" y="220" class="small">mean about me?</text><text x="813" y="210" class="head">→</text><rect x="839" y="115" width="235" height="165" rx="14" fill="#e3edf6"/><text x="857" y="153" class="label">Action</text><text x="857" y="191" class="small">What will I seek</text><text x="857" y="220" class="small">or change next?</text><path d="M930 300 V345 H152 V300" fill="none" stroke="#298376" stroke-width="4"/><text x="245" y="392" class="small">Actions help shape later situations and available evidence.</text></svg>