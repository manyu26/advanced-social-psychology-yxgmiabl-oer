<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="460" viewBox="0 0 1100 460" role="img" aria-labelledby="title desc"><title id="title">Rank accuracy and calibration differ</title><desc id="desc">Actual scores 50, 65, 80; estimates 60, 75, 90; every error is plus ten.</desc><rect width="1100" height="460" rx="24" fill="#f5f8fb"/><style>text{font-family:Arial,sans-serif;fill:#17334a}.head{font-size:28px;font-weight:700}.label{font-size:23px;font-weight:700}.small{font-size:20px}</style><text x="40" y="54" class="head">Correct ordering can coexist with consistent overestimation</text><text x="60" y="100" class="small">Hypothetical teaching scores — not empirical findings</text><text x="45" y="167" class="label">A</text><rect x="90" y="140" width="350" height="23" rx="4" fill="#277b77"/><rect x="90" y="169" width="420" height="23" rx="4" fill="#d49137"/><text x="454" y="160" class="small">50 actual</text><text x="524" y="189" class="small">60 estimated</text><text x="895" y="172" class="label">+10</text><text x="45" y="252" class="label">B</text><rect x="90" y="225" width="455" height="23" rx="4" fill="#277b77"/><rect x="90" y="254" width="525" height="23" rx="4" fill="#d49137"/><text x="559" y="245" class="small">65 actual</text><text x="629" y="274" class="small">75 estimated</text><text x="895" y="257" class="label">+10</text><text x="45" y="337" class="label">C</text><rect x="90" y="310" width="560" height="23" rx="4" fill="#277b77"/><rect x="90" y="339" width="630" height="23" rx="4" fill="#d49137"/><text x="664" y="330" class="small">80 actual</text><text x="734" y="359" class="small">90 estimated</text><text x="895" y="342" class="label">+10</text><text x="60" y="425" class="small">Rank order: preserved     |     Mean signed error: +10 points</text></svg>