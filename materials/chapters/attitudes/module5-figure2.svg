<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="380" viewBox="0 0 1100 380" role="img"><title>One midpoint, two possibilities</title><desc>The same midpoint can reflect indifference or opposing evaluations; felt conflict needs its own measure.</desc><rect width="1100" height="380" rx="22" fill="#f3f7fa"/><text x="40" y="58" font-family="Arial,sans-serif" font-size="29" font-weight="bold" fill="#19384a">One midpoint, two possibilities</text><rect x="40.0" y="110" width="325.3333333333333" height="165" rx="14" fill="#e0ebf3"/><text x="58.0" y="166" font-family="Arial,sans-serif" font-size="23" fill="#19384a">Little positive + little</text><text x="58.0" y="196" font-family="Arial,sans-serif" font-size="23" fill="#19384a">negative</text><rect x="387.3333333333333" y="110" width="325.3333333333333" height="165" rx="14" fill="#e0ebf3"/><text x="405.3333333333333" y="166" font-family="Arial,sans-serif" font-size="23" fill="#19384a">Strong positive + strong</text><text x="405.3333333333333" y="196" font-family="Arial,sans-serif" font-size="23" fill="#19384a">negative</text><rect x="734.6666666666666" y="110" width="325.3333333333333" height="165" rx="14" fill="#e0ebf3"/><text x="752.6666666666666" y="166" font-family="Arial,sans-serif" font-size="23" fill="#19384a">Ask about felt conflict</text><text x="40" y="315" font-family="Arial,sans-serif" font-size="19" fill="#19384a">The same midpoint can reflect indifference or opposing evaluations; felt conflict needs its own</text><text x="40" y="340" font-family="Arial,sans-serif" font-size="19" fill="#19384a">measure.</text></svg>